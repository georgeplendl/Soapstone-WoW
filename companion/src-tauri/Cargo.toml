[package]
name = "soapstone-companion"
version = "0.1.0"
description = "Soapstone companion: syncs the Soapstone addon's stones with the shared database"
authors = ["George Plendl"]
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "soapstone_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
