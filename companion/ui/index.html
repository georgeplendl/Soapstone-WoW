<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soapstone</title>
<style>
  :root {
    --bg: #f4efe6; --panel: #fffaf2; --ink: #2b2620; --muted: #7a6f62; --line: #e2d8c8;
    --gold: #b4832a; --ok: #3f7d4e; --warn: #a0562b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17140f; --panel: #211d17; --ink: #ece4d6; --muted: #9c917f; --line: #352e25;
      --gold: #d8a84a; --ok: #7fbf8c; --warn: #e0925f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { padding: 18px 20px 10px; display: flex; align-items: baseline; gap: 12px; }
  h1 { margin: 0; font: 600 20px Georgia, "Times New Roman", serif; color: var(--gold); letter-spacing: .02em; }
  main { padding: 0 20px 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
  .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .ok { color: var(--ok); }
  .warn { color: var(--warn); }
  .path { font-family: Consolas, ui-monospace, monospace; font-size: 12px; color: var(--muted); word-break: break-all; }
  h2 { margin: 0 0 4px; font-size: 15px; }
  ul { list-style: none; margin: 8px 0 0; padding: 0; }
  li { padding: 6px 0; border-top: 1px solid var(--line); }
  button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--gold); }
</style>
</head>
<body>
<header>
  <h1>Soapstone</h1>
  <span class="muted small" id="scanned"></span>
  <span style="flex:1"></span>
  <button id="rescan">Check now</button>
</header>
<main>
  <section class="card">
    <div class="row"><strong>Server</strong><span id="connection" class="muted">Connecting…</span></div>
    <div class="path" id="server"></div>
  </section>
  <section id="folders"></section>
  <p class="muted small">Settings and the install token are kept in <span class="path" id="config"></span></p>
</main>
<script src="main.js"></script>
</body>
</html>
