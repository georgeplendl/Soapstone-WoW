<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soapstone</title>
<style>
  :root {
    --bg: #f4efe6; --panel: #fffaf2; --ink: #2b2620; --muted: #7a6f62; --line: #e4dacb;
    --gold: #a8761d; --ok: #3f7d4e; --warn: #a0562b; --chip: #efe5d4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17140f; --panel: #211d17; --ink: #ece4d6; --muted: #9c917f; --line: #352e25;
      --gold: #d8a84a; --ok: #7fbf8c; --warn: #e0925f; --chip: #2e2820;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
  main { padding: 18px 20px 24px; max-width: 640px; margin: 0 auto; }
  h1 { margin: 0; font: 600 20px Georgia, "Times New Roman", serif; color: var(--gold); letter-spacing: .02em; }
  h2 { margin: 0; font-size: 16px; }
  h3 { margin: 14px 0 2px; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .grow { flex: 1; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .hero { display: flex; gap: 12px; align-items: flex-start; }
  .dot { width: 12px; height: 12px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); }
  .hero-title { font-size: 17px; font-weight: 600; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .ok { color: var(--ok); } .warn { color: var(--warn); }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .badge.warn { color: var(--warn); border-color: var(--warn); }
  dl { display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; margin: 10px 0 0; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 0 9px; font-size: 13px; }
  .note { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip); font-size: 13px; }
  .note.warn { color: var(--warn); }
  .card details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
  details.about { padding: 2px 4px; }
  summary { cursor: pointer; color: var(--muted); font-size: 12px; user-select: none; }
  .facts { display: grid; grid-template-columns: 140px 1fr; gap: 3px 12px; margin-top: 6px; font-size: 12px; }
  .facts dt { color: var(--muted); }
  .code { font-family: Consolas, ui-monospace, monospace; font-size: 12px; word-break: break-all; }
  button { font: inherit; padding: 5px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--gold); }
  button:disabled { color: var(--muted); cursor: default; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Soapstone</h1>
    <span class="grow"></span>
    <button id="rescan">Check now</button>
  </div>
  <section class="card hero">
    <span class="dot" id="dot"></span>
    <div>
      <div class="hero-title" id="headline">Looking for World of Warcraft…</div>
      <div class="muted" id="subline"></div>
    </div>
  </section>
  <div id="games"></div>
  <details class="about">
    <summary>Server and install details</summary>
    <dl class="facts" id="facts"></dl>
  </details>
</main>
<script src="main.js"></script>
</body>
</html>
