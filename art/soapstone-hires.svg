<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="-256 -256 512 512">
  <defs>
    <linearGradient id="front" x1="0" y1="-140" x2="0" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff6e0"/>
      <stop offset="0.35" stop-color="#fbe2a4"/>
      <stop offset="0.7" stop-color="#f6b93c"/>
      <stop offset="1" stop-color="#ec8a12"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="-140" x2="0" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbe6b4"/>
      <stop offset="0.5" stop-color="#f3ad34"/>
      <stop offset="1" stop-color="#d9670c"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="-130" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9c48a"/>
      <stop offset="0.5" stop-color="#a99a55"/>
      <stop offset="1" stop-color="#6f6a35"/>
    </linearGradient>
    <linearGradient id="capTop" x1="0" y1="-210" x2="0" y2="-130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fdeec8"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" y1="165" x2="0" y2="205" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e57a10"/>
      <stop offset="1" stop-color="#b8480a"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#fffbe8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff3c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd25a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff9a1a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frontClip">
      <polygon points="-70,-130 60,-140 65,165 -65,170"/>
    </clipPath>
  </defs>

  <g transform="rotate(-40)" stroke-linejoin="round">
    <!-- silhouette outline -->
    <polygon points="-110,-120 -55,-205 45,-210 110,-135 110,150 60,205 -60,200 -110,155"
             fill="#5b3a12" stroke="#5b3a12" stroke-width="12"/>

    <!-- faces -->
    <polygon points="-110,-120 -70,-130 -65,170 -110,155" fill="url(#left)"/>
    <polygon points="60,-140 110,-135 110,150 65,165" fill="url(#right)"/>
    <polygon points="-70,-130 60,-140 65,165 -65,170" fill="url(#front)"/>
    <polygon points="-55,-205 45,-210 60,-140 -70,-130" fill="url(#capTop)"/>
    <polygon points="-110,-120 -55,-205 -70,-130" fill="#efe2b8"/>
    <polygon points="45,-210 110,-135 60,-140" fill="#fde7b0"/>
    <polygon points="-65,170 65,165 60,205 -60,200" fill="url(#bottom)"/>
    <polygon points="-110,155 -65,170 -60,200" fill="#7a4e14"/>
    <polygon points="65,165 110,150 60,205" fill="#a8400a"/>

    <!-- inner shards on the front face -->
    <g clip-path="url(#frontClip)">
      <polygon points="-70,-60 -10,-110 20,10 -40,60" fill="#ffffff" opacity="0.35"/>
      <polygon points="10,-60 60,-30 55,60 0,90" fill="#f5a623" opacity="0.35"/>
      <polygon points="-60,40 -5,20 30,120 -30,170" fill="#e9850f" opacity="0.4"/>
      <polygon points="20,80 65,60 65,165 30,170" fill="#d4570a" opacity="0.45"/>
      <polygon points="-40,-120 25,-135 -5,-40" fill="#ffffff" opacity="0.5"/>
      <ellipse cx="15" cy="120" rx="55" ry="45" fill="url(#ember)" opacity="0.6"/>
      <line x1="-70" y1="-60" x2="20" y2="10" stroke="#fff8e6" stroke-width="3" opacity="0.6"/>
      <line x1="-5" y1="20" x2="55" y2="60" stroke="#fff1c8" stroke-width="2.5" opacity="0.5"/>
    </g>

    <!-- facet edge highlights -->
    <g fill="none" stroke="#fffaf0" stroke-width="3" opacity="0.7">
      <polyline points="-110,-120 -70,-130 60,-140 110,-135"/>
      <line x1="-70" y1="-130" x2="-65" y2="170"/>
      <line x1="-55" y1="-205" x2="-70" y2="-130"/>
    </g>
    <g fill="none" stroke="#9a4a0c" stroke-width="2.5" opacity="0.5">
      <line x1="60" y1="-140" x2="65" y2="165"/>
      <polyline points="-110,155 -65,170 65,165 110,150"/>
    </g>
  </g>

  <!-- sparkle near the upper tip -->
  <g transform="translate(-70,-88)">
    <circle r="70" fill="url(#glow)"/>
    <path d="M0,-58 L7,-7 L58,0 L7,7 L0,58 L-7,7 L-58,0 L-7,-7 Z" fill="#ffffff"/>
  </g>
</svg>
